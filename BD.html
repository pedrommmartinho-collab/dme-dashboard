</style><style>body{background:#F7F3EF;color:#30261D}.splash{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:linear-gradient(135deg,#FFFDFC 0%,#F7F3EF 58%,#EFE5DE 100%);text-align:center}.brand{position:absolute;top:26px;left:30px;font-weight:950;color:#30261D;letter-spacing:1px}.solution{display:inline-block;color:#30261D;font-size:14px;font-weight:900;letter-spacing:3px;margin-bottom:18px;padding-bottom:8px;border-bottom:3px solid #FF595A}.brand span{color:#FF595A}.splash h1{font-size:clamp(44px,7vw,100px);margin:0;color:#30261D;letter-spacing:-2px}.splash p{font-size:22px;line-height:1.7;color:#6A584B}.splash button,.controls button{border:0;border-radius:2px;padding:13px 20px;font-weight:950;cursor:pointer}.splash button{background:#FF595A;color:#fff}.screen{height:100%;position:relative;overflow:hidden;background:#F7F3EF}.comic{position:absolute;width:6144px;height:4096px;left:50%;top:50%;transform-origin:center;background:url("luca_in_lisbon_comic_4k.png" ) center/contain no-repeat;transition:transform 1s cubic-bezier(.16,.82,.18,1),filter .5s}.frame{position:absolute;inset:18px;border:2px solid #30261D;pointer-events:none;box-shadow:inset 0 0 0 5px #FFFFFF}.controls{position:absolute;right:28px;bottom:25px}.controls button{background:#30261D;color:#fff}.controls button:last-child{background:#FF595A;color:#fff}.progress{position:absolute;left:34px;bottom:32px;width:42%;height:3px;background:#30261D20}.bar{height:100%;background:#FF595A;transition:width .5s}.final{position:absolute;inset:0;background:linear-gradient(135deg,#FFFDFC 0%,#F7F3EF 58%,#EFE5DE 100%);color:#30261D;display:grid;place-items:center;text-align:center;opacity:0;pointer-events:none;transition:.7s}.final:after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:#FF595A}.final.show{opacity:1}.final-nbs{font-size:22px;font-weight:950;letter-spacing:1px;margin-bottom:18px;color:#30261D}.final-nbs span{color:#FF595A}.final-solution{display:inline-block;color:#30261D;font-size:14px;font-weight:950;letter-spacing:3px;margin-bottom:22px;padding-bottom:8px;border-bottom:3px solid #FF595A}.final h2{font-size:clamp(36px,5vw,76px);max-width:1120px;margin:0;color:#30261D;letter-spacing:-1.5px;line-height:1.08}.final p{font-size:22px;color:#FF595A;font-weight:950;letter-spacing:2px;margin-top:28px}.final-drive{font-size:clamp(34px,5vw,72px)!important;line-height:1.05;letter-spacing:-1px!important;margin:22px 0 0!important;color:#30261D!important}.splash:after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:#FF595A}</style></head><body><section class="splash" id="splash"><div class="brand">NBS <span>PORTUGAL</span></div><div><div class="solution">MARKETING &amp; SALES SOLUTIONS</div><h1>WELCOME TO LISBON LUCA</h1><p>Third visit. New stories. Same curiosity.<br><strong style="color:#30261D">People. Projects. Impact.</strong></p><button onclick="start()">ENTER →</button></div></section><main class="screen" id="screen"><div class="comic" id="comic"></div><div class="frame"></div><div class="progress"><div class="bar" id="bar"></div></div><div class="controls"><button onclick="back()">←</button> <button onclick="advance()">NEXT →</button></div><div class="final" id="final"><div><div class="final-nbs">NBS <span>PORTUGAL</span></div><div class="final-solution">MARKETING &amp; SALES SOLUTIONS</div><p class="final-drive">LET'S DRIVE THE SHIFT. TOGETHER.</p></div></div></main><script>const IMG='luca_in_lisbon_comic_4k.png';const scenes=[{"n": "Cover", "x": 0, "y": 0, "w": 1144, "h": 1440}, {"n": "Arrival in Lisbon", "x": 1148, "y": 0, "w": 1072, "h": 1440}, {"n": "A Special Place", "x": 2216, "y": 0, "w": 1112, "h": 1440}, {"n": "On the Way to NBS", "x": 3328, "y": 0, "w": 1376, "h": 1440}, {"n": "Welcome Meeting", "x": 4704, "y": 0, "w": 1440, "h": 1440}, {"n": "Part of the Team", "x": 0, "y": 1440, "w": 1776, "h": 1308}, {"n": "NBS Portugal Passport", "x": 1776, "y": 1440, "w": 1760, "h": 1308}, {"n": "What You Are About to See", "x": 3536, "y": 1440, "w": 2608, "h": 1308}, {"n": "Above All, People", "x": 0, "y": 2748, "w": 1776, "h": 1348}, {"n": "The SHIFT Strategy", "x": 1776, "y": 2748, "w": 1276, "h": 1348}, {"n": "Let's Start", "x": 3052, "y": 2748, "w": 1200, "h": 1348}, {"n": "Driving the SHIFT Together", "x": 4252, "y": 2748, "w": 1892, "h": 1348}];let i=-1,ended=false;function position(){if(i<0){let s=Math.min(innerWidth/6144,innerHeight/4096)*.93;comic.style.transform=`translate(-50%,-50%) scale(${s})`;bar.style.width='0%';return}let a=scenes[i],p=42,s=Math.min((innerWidth-p*2)/a.w,(innerHeight-p*2)/a.h),dx=(3072-(a.x+a.w/2))*s,dy=(2048-(a.y+a.h/2))*s;comic.style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${s})`;bar.style.width=((i+1)/scenes.length*100)+'%';}function start(){splash.classList.add('hidden');position()}function advance(){if(ended)return;if(i<scenes.length-1){i++;position()}else{ended=true;final.classList.add('show')}}function back(){if(ended){ended=false;final.classList.remove('show');return}if(i>-1){i--;position()}}addEventListener('resize',position);addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')advance();if(e.key==='ArrowLeft')back();if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});position();</script></body></html>
